openapi: 3.0.3
info:
  title: Sample API / API de exemplo
  description: |
    EN: Minimal OpenAPI starter.
    PT: Starter OpenAPI mínimo.
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
    description: Production / Produção
  - url: http://localhost:3000/v1
    description: Local
paths:
  /health:
    get:
      summary: Health check / Verificação de saúde
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy / Serviço saudável
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /items:
    get:
      summary: List items / Listar itens
      operationId: listItems
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        ts:
          type: string
          format: date-time
    Item:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
